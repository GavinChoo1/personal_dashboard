name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID || 'personal-dashboard-507703' }}
      TF_VAR_region: "us-central1"

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud using Service Account Key stored in GitHub Secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Setup Terraform CLI on GitHub Actions runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # 4. Initialize Terraform plugins and backend
      - name: Terraform Init
        run: terraform init

      # 5. Check Terraform syntax and validate configuration
      - name: Terraform Validate
        run: terraform validate -no-color

      # 6. Generate Terraform execution plan (Runs on both PRs and Pushes)
      - name: Terraform Plan
        run: terraform plan -no-color

      # 7. Apply Terraform configuration (Runs ONLY on direct push or merge to main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color
